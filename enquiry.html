<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - KOZY</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo"><img src="images/logo.png" alt="KOZY Clothing Logo" width="120"></div>
        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="product.html">Products</a></li>
                <li><a href="enquiry.html" class="active">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Business Enquiry</h1>
         <form action="#" method="post">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required aria-required="true">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required aria-required="true">

             <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" aria-describedby="phone-description">

            <p>Enquiry Type:</p>
            <input type="radio" id="wholesale" name="interest" value="Wholesale">
            <label for="wholesale">Wholesale Order</label><br>
            <input type="radio" id="collab" name="interest" value="Collaboration">
            <label for="collab">Collaboration</label><br>
            <input type="radio" id="custom" name="interest" value="Custom Order">
            <label for="custom">Custom Order</label><br><br>

             <label for="product">Product Interest</label>
            <select id="product" name="product">
                <option value="hoodie">Hoodies</option>
                <option value="Jacket">Jackets</option>
                <option value="Bags">Bags</option>
            </select>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required aria-required="true"></textarea>
            <button type="submit" class="btn">Submit Enquiry</button>

        </form>
    </main>
    <footer>
        <div><h3>KOZY</h3><p>Comfort in Every Stitch.</p></div>
        <div><h3>Quick Links</h3><ul><li><a href="index.html">Home</a></li><li><a href="product.html">Products</a></li></ul></div>
        <div><h3>Contact</h3><p>hello@kozy.co.za</p></div>
        <p>&copy; 2026 KOZY Clothing</p>
    </footer>
</body>
</html>
